[project]
name = "validation-checks"
version = "1.0.0"
description = "Validate country carrier-survey workbooks, honouring red/strikethrough exclusions."
requires-python = ">=3.11.9,<3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rapidfuzz>=3.10",
    "rich>=13.9",
    "sentence-transformers>=3.2",
    "typing-extensions>=4.12",
]

[project.scripts]
validation-checks = "validation_checks.main:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validation_checks"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PTH", "PL", "C4", "PIE", "RET"]
# Keyword-only argument count is fine (PLR0917 still caps positional ones); match-heavy
# functions legitimately return per branch.
ignore = ["PLR2004", "PLR0911", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
